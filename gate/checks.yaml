# Every check this package makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# So the suite does not ask the disk what it checks. It is told here, and
# test/checks/declared_checks_test.dart holds the disk against this file, naming whatever vanished.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it. It is read line by line and the reader imports nothing but dart:io, because the
# same reading is done by the gate itself, which has to answer on a clone where no package has been
# resolved.
#
# ADDING A CHECK MEANS ADDING A LINE. A check file that is not declared here is reported too: an
# undeclared check is one nobody agreed to, and it is how a suite grows a file that judges nothing.
#
# THERE IS NO tool-purity ENTRY, and that is a decision rather than an omission. That scan holds a
# package to naming its TOOLS and never an application of them, out of a word list the package
# carries itself. Both sister halves need it because every other package's scan runs THROUGH them.
# Nothing runs through this one: it is the gate of this organisation's own repositories, and its
# list would be a third copy of the same words.

# The analyzer with infos and warnings fatal and the formatter find nothing to change in this
# package's own tree.
analysis: test/checks/analysis_test.dart
# How the gate reads what the analyzer and the formatter wrote, and that they really are started
# with the flags it claims: one planted tree judged twice, with the flags and without, because "it
# went red" proves nothing until the weakened invocation is shown to go green on the same tree. A
# package nothing resolved is reported NOT ANALYSED and keeps the reading from being green.
analysis-reading: test/checks/analysis_reading_test.dart
# Which packages of a tree the gate is about to check — the denominator every other check is run
# once per entry of. A manifest at a root with no code declares a workspace and is not counted as a
# package of its own, and a manifest under a build output or a resolved dependency is not one either.
dart-packages: test/checks/dart_packages_test.dart
# This file agrees with the suite on disk, and the reading the gate itself does before anything
# runs: every package of a repository that carries a suite has both the declaration and the check
# that holds it against the disk.
declared-checks: test/checks/declared_checks_test.dart
# Every dependency this package resolves out of git names a release tag and never a branch.
dependency-pins: test/checks/dependency_pins_test.dart
# The gate finds every package of the repository it stands in, rather than the one directory its own
# script sits in. A gate that walks its own directory prints "every check green" over files it has
# never opened, and says nothing about the packages standing beside it.
gate-tree: test/checks/gate_tree_test.dart
# The sequence a package gate runs, what it does when a step of it fails, and that a run which
# covered no package is not green.
package-gate: test/checks/package_gate_test.dart
# Everything a binary is composed from answered from one place — all working checkouts or all pushed
# commits, and the gate logs which. A mix, half from the working tree and half from what was pushed
# with nothing saying which half is which, is refused naming both halves.
resolved-packages: test/checks/resolved_packages_test.dart
# The one Dart version the checks are true against is enforced by reading the gate process's own
# version, and every other is refused with both numbers in the refusal.
version-guard: test/checks/version_guard_test.dart
