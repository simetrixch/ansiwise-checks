# release — a pushed tag becomes a GitHub Release, and the tree at that tag IS what it releases.
#
# WHAT STARTS IT. A pushed tag, and nothing else. The version and the channel in it are typed by a
# person: which release a change deserves and how ripe it is are decisions, and nothing here takes
# them. The tag is pushed by `dart run registry/tool/release.dart <version> <channel>`, which shows
# what has been released, proposes what could come next, bumps the version every pubspec.yaml here
# declares, sets every ref naming this repository to the tag, commits that and pushes an annotated
# tag — and it READS the filter below rather than carrying a second copy of it, so a filter edited
# here is the filter a person is held to on the next run. THAT PROGRAM CREATES NO RELEASE: the
# release, its notes and the pre-release marking are this file's work, which is why it needs no `gh`
# and has no `gh` preflight.
#
# WHY NOTHING IS ATTACHED, and why that is a release rather than a formality. These packages produce
# no artefact and nobody downloads one. Every caller resolves them out of git — a package name, this
# repository's url, a `ref:` and the directory the package sits in — so what a caller GETS is the
# tree standing at the ref it named. A tag is therefore the only thing a caller can pin, and
# publishing it is what turns a commit into something nameable. The release page prints the manifest
# lines to write, which is the whole of what a caller has to do with it.
#
# WHAT IS GATED, AND OVER WHAT. Every package of this repository, on the tag, before anything is
# published. A release of a library that does not compile is worse than none, because a caller pins
# it and finds out later — and these two packages are what every other package's checks are made
# of, so a broken tag here does not break one suite, it stops twelve from loading. The packages are
# not listed below: the job walks every pubspec.yaml git tracks, so a package added tomorrow is
# gated by this file without an edit, exactly as the release program bumps it without one.
#
# THE SDK IS NOT PINNED, AND THIS FILE MUST NOT BE READ AS THOUGH IT WERE. Neither manifest here
# names a single toolchain — both state `sdk: ^3.12.0`, which is a range — and there is nothing in
# this repository to read a pin out of. So `stable` is installed, and a gate run against a moving
# toolchain can go red for a formatter that changed rather than for a tree that did: the same class
# of thing this whole file exists to stop, one level down. Closing it means a pinned version living
# in this repository and a guard refusing a run on any other, which is work this file cannot do for
# itself.
name: release

on:
  push:
    tags:
      # THE GRAMMAR IS THE ONE EVERY RELEASE OF EVERYTHING IS CUT UNDER, and it is owned by
      # hostyour-manager/shared/release.ts:22: `<major>.<minor>.<patch>-<channel>-<ts14>`, channel
      # one of alpha|beta|stable, ts14 the UTC yyyyMMddHHmmss the tag was composed at. So
      # 0.1.0-alpha-20260821194500 and 0.1.0-stable-20260901120000 are tags; a bare 0.1.0 is not,
      # v0.1.0 is not, and 0.1.0-beta.2 is not. The channel is ALWAYS there, and it is a CEILING on
      # which environment may run the tag — alpha reaches dev, beta reaches test, stable reaches
      # everywhere. That ceiling is enforced where deployments are written and NOT here
      # (release.ts:8); what this filter decides is only whether a pushed tag builds at all.
      #
      # WHY THE ts14 IS IN THE TAG AND NOT AN AFTERTHOUGHT: two releases of one version on one
      # channel are a real thing — the same version cut again from a later commit — and the stamp is
      # what makes them two tags instead of one name pushed twice.
      #
      # WHAT THESE THREE PATTERNS SAY. One per channel, because a filter pattern has NO ALTERNATION
      # and `alpha|beta|stable` cannot be written in one. This is a filter pattern and NOT a regular
      # expression: `[0-9]` matches one digit, `+` says one or more of what stands before it, `*` is
      # any run of characters carrying no `/`, and everything else — `.` and `-` included — stands
      # for itself (the filter pattern cheat sheet of
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax, read
      # 2026-08-22). A tag matches a pattern only as a WHOLE, which is what the fourteen spelled-out
      # `[0-9]` rest on: the pattern ends after the fourteenth digit, so a fifteenth is left over and
      # starts nothing, and so does 0.1.0-alpha-2026 with only four. There is no `*` anywhere in
      # these patterns, so nothing is swallowed behind the stamp — build metadata like 0.1.0+7
      # starts nothing at all.
      #
      # WHERE THIS IS STILL WIDER THAN THE GRAMMAR, and it is one thing rather than three. There is
      # no alternation, so `0|[1-9][0-9]*` cannot be written and 01.2.3-stable-20260901120000 is
      # admitted here though release.ts:22 refuses it. Narrowing that away would take twenty-seven
      # patterns for the three numbers alone — times three channels — or a negative `!` pattern,
      # which registry/tool/release_tag_filter.dart refuses to read because it reads what a filter
      # ACCEPTS. What closes it instead is registry/tool/release_versions.dart's numbersRefusalFor,
      # in the program that composes the tag, and a leading zero is refused there before anything is
      # pushed.
      #
      # WHAT IS NOT A RESIDUAL: `[0-9]` fourteen times admits 99999999999999, which is no calendar
      # moment — and neither does release.ts:22 refuse it, since it reads `[0-9]{14}` as well. The
      # two agree, so there is nothing here for anything downstream to disagree with.
      - '[0-9]+.[0-9]+.[0-9]+-alpha-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9]+.[0-9]+.[0-9]+-beta-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9]+.[0-9]+.[0-9]+-stable-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      # THE PACKAGES ARE WALKED, NOT LISTED. `git ls-files` answers what this tag really carries, so
      # this step cannot go on gating two packages after a third arrives — the failure mode of a
      # written-out list is a green run over a package nobody checked.
      #
      # The order is the order the paths sort, and that is not an accident that happens to work:
      # registry names its neighbour at this very tag, so its `dart pub get` fetches this repository
      # AT THE TAG THIS RUN IS FOR. That resolve is the proof that the pin the release program wrote
      # is a pin something can actually follow — a ref naming a tag that was never pushed fails
      # here, loudly, before anything is published.
      - name: every package's own gate, on this tag
        shell: bash
        run: |
          set -euo pipefail
          manifests="$(git ls-files '*pubspec.yaml' | sort)"
          test -n "$manifests"
          for manifest in $manifests; do
            package="$(dirname "$manifest")"
            echo "::group::$package"
            ( cd "$package" && dart pub get && dart test )
            echo "::endgroup::"
          done

  publish:
    name: the release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # fetch-depth: 0 because the notes are read from the history: every tag standing here, to find
      # the release this one follows, and the commit subjects in the range between the two. A shallow
      # checkout has neither, and registry/tool/release_notes.dart refuses rather than publish a page
      # that says nothing changed because nobody looked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      # WHAT THE NOTES ARE, and why `--generate-notes` is not what makes them. Generated notes are
      # built from the pull requests merged between two releases and the new contributors among them.
      # THIS REPOSITORY HAS NO PULL REQUESTS: `gh pr list --state all` answers with nothing, and a merge
      # commit is no test of that either way, since a squashed one leaves none. So there is nothing for
      # GitHub to list and the page would carry a compare link and not one line about what changed. Tags
      # being unique per release does not change that — the grammar decides how many releases there are,
      # not where the sentences come from. registry/tool/release_notes.dart reads the commit subjects
      # out of the range instead, prints the manifest lines a caller writes to name this tag, and
      # prints `prerelease=true|false` read from the channel in the tag.
      #
      # NO `dart pub get` ABOVE THIS STEP, and it is run from the repository root rather than from
      # inside the package: everything under registry/tool/ imports nothing but `dart:` and that
      # directory, and the root carries no manifest, so the SDK alone is enough and nothing is
      # resolved to write a page.
      #
      # The one line is GREPPED out of what the program wrote rather than redirected wholesale: this
      # is the only thing standing between the tag and how the release is marked, and a stray line on
      # stdout would become a `prerelease` output nobody wrote. A run that printed no such line fails
      # the step, because no marking at all is better than a marking nothing decided.
      - id: notes
        name: dart run registry/tool/release_notes.dart
        shell: bash
        run: |
          set -euo pipefail
          said="$(dart run registry/tool/release_notes.dart "$TAG" release-notes.md)"
          grep -E '^prerelease=(true|false)$' <<<"$said" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      # NO FILE IS ATTACHED and no glob stands here, because there is nothing to attach: the release
      # is the tree at this tag, and a caller resolves it out of git rather than downloading it.
      #
      # THE CHANNEL DECIDES THE MARKING AND NOTHING ELSE HERE. alpha and beta are pre-releases —
      # hostyour-manager/shared/release.ts:12 ranks stable as the ripest — so they are marked
      # `--prerelease` and stable is published plainly. It is read from the step above rather than
      # from the tag a second time here, and NOT by looking for a hyphen: every tag under this
      # grammar carries two. The channel is also a CEILING on which environment may run the tag, and
      # that ceiling is enforced where deployments are written (release.ts:8), not here: a release
      # published plainly is not a release anybody is judged by. Nobody is, until a caller's own
      # manifest names this tag.
      - name: publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then set -- --prerelease; else set --; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "$@"
