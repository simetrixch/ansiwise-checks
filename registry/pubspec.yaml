# The audits that drive a REGISTRY, and so have to know the framework's types.
#
# It depends on the framework, which is the right direction: this stands ABOVE it and nothing of
# the framework reaches back. The half that only reads files stands beside the framework instead,
# in the package next door, so that the framework can audit its own tree without depending on
# anything of ours. This package re-exports that one, so a package with a registry names this
# single dependency and gets every audit it can run.
name: ansiwise_checks
description: The audits that decide whether a plugin holds the ansiwise contract.
publish_to: none
version: 0.7.4

environment:
  sdk: ^3.12.0

dependencies:
  # The registry, the steps and the three modes an audit drives, plus the fakes it drives them
  # against — a step under probe meets a fake machine, not a real one.
  #
  # NAMED BY GIT REF, LIKE EVERYBODY ELSE. A directory path here is resolved inside whatever
  # checkout pub fetched and recorded as a COMMIT, while every consumer names the framework at a
  # REF — and pub treats a commit and a ref as two different sources, so nothing resolved from a
  # clone at all.
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 0.7.3-stable-20260831002636
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.7.4-stable-20260901191607
      path: tree
  path: ^1.9.1
  test: ^1.31.2
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
