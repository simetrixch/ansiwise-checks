# Every check this package makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# So the suite does not ask the disk what it checks. It is told here, and
# test/checks/declared_checks_test.dart holds the disk against this file, naming whatever vanished.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it. It is read line by line and the reader imports nothing but dart:io, because the
# same reading is done by gate programs that have to start on a fresh clone where no package has been
# resolved.
#
# ADDING A CHECK MEANS ADDING A LINE. A check file that is not declared here is reported too: an
# undeclared check is one nobody agreed to, and it is how a suite grows a file that judges nothing.

# The analyzer with infos and warnings fatal and the formatter find nothing to change in this
# package's own tree.
analysis: test/checks/analysis_test.dart
# This file agrees with the suite on disk, and the refusal that enforces it can really go red.
declared-checks: test/checks/declared_checks_test.dart
# This package names its tools and never an application of them. These audits are what every other
# package's checks are made of, so a product name here travels to every package that runs them
# without any of them writing it down, and nothing outside this repository reads these files.
tool-purity: test/checks/tool_purity_test.dart
# THE RELEASE CHECK IS GONE, AND SO IS THE RELEASE. This repository holds the criteria every
# gate judges by; it is a part of ansiwise-cli and is released by nobody. Its workflow built
# nothing — it only turned a tag into a release page nothing reads, because a git dependency
# resolves out of the TAG. What names this repository now is a commit, written by the
# product's own release/release.sh on 2026-09-01.
# Every dependency this package resolves out of git names a release tag and never a branch. Two are
# judged: ansiwise_core, which whoever resolves this package resolves too, and the tree half of this
# same repository, reached out of git so the two halves are released together and read each other
# at the version they were released at. The sister package runs the same audit over its own
# manifest, so between them every manifest of this repository is judged.
dependency-pins: test/checks/dependency_pins_test.dart
